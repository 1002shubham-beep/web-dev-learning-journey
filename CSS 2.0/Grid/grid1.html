<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
  </head>
  <style>
    .container {
      border: 2px solid black;
      display: grid;
      width: 80vw;
      height: 100vh;
      /* grid-template-columns: 10px 20px auto 20px 10px;
      grid-template-rows: 25% 50px auto;
      height: 500px;
      width: 500px; */

      /* grid-template-columns:
        [pehla-column]120px [doosra-column]100px
        [teesra-column]; */
      /* grid-template-rows: 100px 100px 100px; */
      /* grid-template-rows: repeat(3, 100px); */
      grid-template-rows: repeat(3, minmax(100px, 1fr));

      grid-template-columns: 1fr 2fr 1fr;
      gap: 10px 44px;

      justify-items: center;
      align-items: center;
    }
    .items {
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid red;
      height: 55px;
      width: 55px;
      font-size: 20px;
    }
    .item5 {
      align-self: flex-start;
      justify-self: end;
    }
    /* .item3,
    .item1 {
      grid-row-start: 1;
      grid-row-end: 2;
      grid-column-start: 1;
      grid-column-end: 2;
    } */

    /* .item4 {
      grid-row: 1/2;
      grid-column: pehla-column/teesra-column;
    } */
  </style>
  <body>
    <div class="container">
      <div class="items item1">1</div>
      <div class="items item2">2</div>
      <div class="items item3">3</div>
      <div class="items item4">4</div>
      <div class="items item5">5</div>
    </div>
  </body>
</html>
