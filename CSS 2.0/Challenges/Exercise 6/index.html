<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
  </head>
  <style>
    .navbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .list > ul {
      list-style: none;
      display: flex;
      gap: 34px;
    }
  </style>
  <body>
    <nav class="navbar">
      <div class="img">
        <img
          src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg"
          alt=""
        />
      </div>
      <div class="list">
        <ul>
          <li>
            Products<svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 1024 1024"
            >
              <path class="nigbir" />
            </svg>
          </li>
          <li>
            Pricing<svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 1024 1024"
            >
              <path class="nigbir" />
            </svg>
          </li>
          <li>
            Resources<svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 1024 1024"
            >
              <path class="nigbir" />
            </svg>
          </li>
          <li>
            About Us<svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 1024 1024"
            >
              <path class="nigbir" />
            </svg>
          </li>
        </ul>
        <div class="end"></div>
      </div>
    </nav>
  </body>
</html>
