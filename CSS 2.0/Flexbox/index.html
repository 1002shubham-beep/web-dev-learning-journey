<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
  </head>
  <style>
    .container {
      border: 2px solid red;
      display: flex;
      height: 80vh;
      /* justify-content: center; */
      align-items: center;
      flex-direction: row;
      flex-wrap: wrap;
      align-content: start;
      gap: 5px 10px; /*row gap, column gap*/
      /* flex-flow: row wrap; */
    }
    .item {
      height: 92px;
      width: 92px;
      background-color: blue;
      border: 2px solid black;
      /* margin: 4px; */
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: larger;
    }
    .order {
      order: 0; /*Default-order=0*/
      /* flex-grow: 1; */
      /*flex-shrink: 2;*/
      align-self: flex-end;
    }
    /* .flexend {
      align-self: flex-end;
    } */
  </style>
  <body>
    <main>
      <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item order">Shubh</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item flexend">5</div>
      </div>
    </main>
  </body>
</html>
