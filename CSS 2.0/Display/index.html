<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Display Property</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div {
        background-color: red;
        display: inline-block;
        border: 2px solid black;
        display: grid;

        height: 10vh;
        width: 80vw;
      }
      span {
        display: block;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div>I am a box</div>
    <span>I am a good</span>
    <span>boy</span>
  </body>
</html>
