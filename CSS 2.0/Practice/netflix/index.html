<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix India – Watch Shows Online, Watch Movies Online</title>
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap");
    * {
      margin: 0;
      padding: 0;
      font-family: "Oswald", sans-serif;
      font-optical-sizing: auto;
    }
    body {
      background:
        linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url(IN-en-20260608-TRIFECTA-perspective_d70af879-e407-4aee-8615-4c82210065d5_medium.jpg);

      background-size: cover;
      background-position: center;
    }
    .buttons > button {
      margin: 100px;
    }
    .buttons > button {
      height: 300px;
      width: 150px;
      -webkit-nbsp-mode: normal;
    }
    header {
      display: flex;
      justify-content: center;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 70vw;
    }
    button {
      padding: 8px;
      border: none;
      border-radius: 5px;
    }
    .container {
      color: white;
      font-size: 20px;
      text-align: center;
      margin: 10px;
      font-size: large;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 85vh;
    }
    input {
      height: 50px;
      width: 300px;
      border-radius: 4px;
    }
    .input {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .redbtns {
      color: white;
      background-color: #e50914;
    }
  </style>
  <body>
    <header>
      <nav>
        <img width="200px" src="Netflix_Logo_PMS.png" alt="" />
        <div class="buttons">
          <button>English</button><button class="redbtns">Sign In</button>
        </div>
      </nav>
    </header>
    <main>
      <div class="container">
        <h1>Unlimited movies, shows, and more</h1>
        <p>Starts at ₹149. Cancel at any time.</p>
        <p>
          Ready to watch? Enter your email to create or restart your membership.
        </p>
        <div class="input">
          <input type="text" placeholder="Email address" /><button
            class="redbtns"
          >
            Get Started
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
