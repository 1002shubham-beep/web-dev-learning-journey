<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity</title>
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cute+Font&family=Oswald:wght@200..700&display=swap");
    main {
      font-family: "Oswald";
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }
    .box {
      color: beige;

      border-radius: 12px;
      box-shadow: 10px 5px 30px black;
      width: 300px;
      overflow: hidden;
      transition: 0.3s;
    }
    .box > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
    }
    button {
      padding: 10px;
      background-color: beige;
      border: none;
      border-radius: 12px;
      color: chocolate;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      transform: translateY(-4px);
      transition: 0.3s;
    }
    .heart {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .heart {
      position: absolute;
      font-size: 2rem;
      animation: float 6s infinite linear;
      opacity: 0.6;
    }
    .h1 {
      left: 10%;
    }
    .h2 {
      left: 50%;
    }
    .h3 {
      left: 80%;
      animation-delay: 4s;
    }
    @keyframes float {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(-100px);
      }
    }
    @keyframes floatingcard {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0);
      }
    }
    .box > img {
      animation: floatingcard 4s infinite ease-in-out 2s;
    }
    .box:hover {
      transform: translateY(-15px) scale(1.04);
      box-shadow: 0 20px 40px rgba(255, 143, 163, 0.45);
    }
    .selected {
      border: 4px solid #ff8fa3;
      box-shadow: 0 0 25px rgba(255, 143, 163, 0.7);
      transform: scale(1.05);
    }
  </style>
  <body>
    <div class="heart h1">❤️</div>
    <div class="heart h2">❤️</div>
    <div class="heart h3">❤️</div>
    <main>
      <h1>How should we spend our time together?✨</h1>
      <p>Choose whatever sounds most fun.</p>
      <div class="container">
        <div class="box a1" data-activity="Coffee & Conversation">
          <img src="ChatGPT Image Jun 14, 2026, 08_16_52 PM.png" alt="" />
        </div>
        <div class="box a2" data-activity="Ice Cream Date">
          <img src="ChatGPT Image Jun 14, 2026, 08_18_33 PM.png" alt="" />
        </div>
        <div class="box a3" data-activity="Evening Walk">
          <img src="evening walk.png" alt="" />
        </div>
        <div class="box a4" data-activity="Movie">
          <img src="movie.png" alt="" />
        </div>
        <div class="box a5" data-activity="Study Session">
          <img src="study.png" alt="" />
        </div>
      </div>
      <button id="nextBtn">Continue..❤️</button>
    </main>
    <script>
      const cards = document.querySelectorAll(".box");
      const nextBtn = document.getElementById("nextBtn");

      let selectedActivity = "";

      cards.forEach((card) => {
        card.addEventListener("click", () => {
          cards.forEach((c) => {
            c.classList.remove("selected");
          });

          card.classList.add("selected");

          selectedActivity = card.dataset.activity;

          localStorage.setItem("activity", selectedActivity);
        });
      });

      nextBtn.addEventListener("click", () => {
        if (selectedActivity === "") {
          alert("Please choose an activity ❤️");

          return;
        }

        window.location.href = "confirmation.html";
      });
    </script>
  </body>
</html>
