<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    ul {
      transform: rotate(90deg);
      display: flex;
      align-items: center;
      gap: 50px;
      transition: transform 0.5s ease;
    }
    nav {
      background-color: grey;
      color: white;
      transition: width 0.5s ease-in-out;
    }
    nav:hover {
      width: 30vw;
    }
  </style>
  <body>
    <nav>
      <ul>
        <h3>Welcome</h3>
        <li>Home</li>
        <li>Products</li>
        <li>Orders</li>
      </ul>
    </nav>
  </body>
</html>
