<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filters</title>
  </head>
  <style>
    .img1 {
      /* filter: blur(100px); */
      filter: brightness(100%);
    }
    .img2 {
      /* filter: contrast(200%); */
      filter: sepia(100%);
    }
    .img3 {
      /* filter: grayscale(100%); */
      filter: opacity(90%);
    }
  </style>
  <body>
    <div class="container">
      <img
        class="img1"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRurc9uRCq3WBgzxfOTnePPB1tjTfbQj73yDPsG4KSUelki6mxIq5QIiVeQ&s=10"
        alt=""
      />
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8PDCHKgxyGTaDlB1-_emVJgW3L3GNeU5Ko3sXgHngV2dJDY_zibGksS71Kt1DfJ75iHrGicEU8XDUj10vVU_6EL99P0-jm1mLJovLPA&s=10"
        alt=""
        class="img2"
      />
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSL3GPOO6dKaoValj1ckzGf7L87dOCAPpkEFIyhRBTvfQ&s=10"
        alt=""
        class="img3"
      />
    </div>
  </body>
</html>
