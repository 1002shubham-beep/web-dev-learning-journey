<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .box {
        height: 433px;
        width: 80vw;
        border: 2px solid black;
        padding: 3px;
        margin: 3px;
      }
      .box1 {
        background-color: aqua;
        position: absolute;
        top: 0px;
        left: 0px;
        /* position: relative;
        z-index: 1; */
      }
      .box2 {
        background-color: azure;
        position: relative;
        /* bottom: 10px;
        left: 10px; */
      }
      .box3 {
        background-color: antiquewhite;
        /* position: fixed;
        bottom: 0px;
        left: 25vw; */
      }
      .box4 {
        background-color: purple;
        position: sticky;
        bottom: 0px;
      }
      .parent {
        padding: 43px;
        margin: 34px;
        border: 2px solid purple;
        /*Exception: position: sticky; transform, filter or perspective properties can also make an element appear as positioned */
        /* transform: translate(0); */
        /* filter: invert(); */
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box1 box"></div>
      <div class="box2 box"></div>
      <div class="box3 box"></div>
      <div class="box4 box"></div>
    </div>
  </body>
</html>
