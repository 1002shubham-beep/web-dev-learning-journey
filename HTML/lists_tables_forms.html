<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div>Unordered list</div>
      <ul>
        Fruits
        <li>Apple</li>
        <li>Mango</li>
        <li>Papaya</li>
        <li>Watermelon</li>
      </ul>
      <div>
        Ordered list
        <ol>
          Vegetables
          <li>Potato</li>
          <li>Tomato</li>
          <li>Onion</li>
          <li>Brinjal</li>
        </ol>
      </div>
      <div>
        Tables
        <br />
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Roll No.</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Shubham</td>
              <td>78</td>
            </tr>
            <tr>
              <td>Shradha</td>
              <td>79</td>
            </tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th colspan="2">Groceries</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Potato</td>
              <td>2Kg</td>
            </tr>
            <tr>
              <td>Onion</td>
              <td>1.5Kg</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
